apiVersion: 1

datasources:
  - name: MySQL
    type: mysql
    access: proxy
    url: mysql:3306
    database: ${DB_DATABASE:-forsensesii}
    user: ${DB_USERNAME:-forsensesii}
    password: ${DB_PASSWORD:-forsensesii123}
    isDefault: true
    jsonData:
      mysqlVersion: "8.0"
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
    secureJsonData:
      password: ${DB_PASSWORD:-forsensesii123}
